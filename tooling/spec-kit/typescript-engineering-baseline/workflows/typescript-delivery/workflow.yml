schema_version: "1.0"

workflow:
  id: typescript-delivery
  name: TypeScript Delivery
  version: 0.1.0
  author: typescript-engineering-baseline
  description: classify -> specify -> clarify/Example Mapping -> formulate Gherkin -> verify traceability -> Gate 1 -> plan/contracts -> verify -> Gate 2 -> tasks -> analyze -> implement -> verify -> converge

requires:
  speckit_version: "==1.0.5"
  integrations:
    any: [codex, copilot, claude, gemini, opencode]
  permissions:
    - shell

inputs:
  lane:
    type: enum
    values: [full, standard, lightweight]
    required: true
    prompt: Select the classified delivery lane
  observable_behavior:
    type: boolean
    default: false
    prompt: Does the Standard change alter observable behavior?

steps:
  - id: classify
    command: speckit.classify
  - id: lane
    type: switch
    expression: "{{ inputs.lane }}"
    cases:
      full:
        - id: specify-full
          command: speckit.specify
        - id: clarify-example-mapping
          command: speckit.example-map
        - id: formulate-gherkin
          command: speckit.formulate
        - id: verify-before-gate-1
          type: shell
          run: pnpm baseline:verify
        - id: gate-1
          type: gate
          message: "Gate 1: approve specification, Example Mapping, and Gherkin behavior."
          options: [approve, reject]
          on_reject: abort
        - id: plan
          command: speckit.plan
        - id: define-contracts
          command: speckit.contracts
        - id: verify-before-gate-2
          type: shell
          run: pnpm baseline:verify
        - id: gate-2
          type: gate
          message: "Gate 2: approve implementation plan and applicable contracts."
          options: [approve, reject]
          on_reject: abort
        - id: tasks
          command: speckit.tasks
        - id: analyze
          command: speckit.analyze
        - id: implement
          command: speckit.implement
        - id: verify-after-implementation
          type: shell
          run: pnpm baseline:check
        - id: converge
          command: speckit.converge
      standard:
        - id: specify-standard
          command: speckit.specify
        - id: formulate-observable-regression
          type: if
          condition: "{{ inputs.observable_behavior }}"
          then:
            - id: formulate-standard-gherkin
              command: speckit.formulate
        - id: verify-standard
          type: shell
          run: pnpm baseline:verify
        - id: plan-standard
          command: speckit.plan
        - id: tasks-standard
          command: speckit.tasks
        - id: analyze-standard
          command: speckit.analyze
        - id: implement-standard
          command: speckit.implement
        - id: verify-standard-complete
          type: shell
          run: pnpm baseline:check
        - id: converge-standard
          command: speckit.converge
      lightweight:
        - id: specify-intent-and-invariants
          command: speckit.specify
        - id: verify-lightweight
          type: shell
          run: pnpm baseline:verify
        - id: implement-lightweight
          command: speckit.implement
        - id: converge-lightweight
          command: speckit.converge
    default:
      - id: invalid-lane
        type: gate
        message: "Classification must resolve to Full, Standard, or Lightweight."
        options: [reject]
        on_reject: abort
