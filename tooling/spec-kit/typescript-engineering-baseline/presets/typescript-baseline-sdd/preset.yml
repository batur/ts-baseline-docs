schema_version: "1.0"

preset:
  id: typescript-baseline-sdd
  name: TypeScript Baseline SDD
  version: 0.1.0
  description: Proportional Full, Standard, and Lightweight delivery templates for TypeScript.
  author: typescript-engineering-baseline
  license: MIT

requires:
  speckit_version: "==1.0.5"

provides:
  templates:
    - type: template
      name: spec-template
      file: templates/spec-template.md
      strategy: replace
    - type: template
      name: spec-template-full
      file: templates/spec-template-full.md
      strategy: replace
    - type: template
      name: spec-template-standard
      file: templates/spec-template-standard.md
      strategy: replace
    - type: template
      name: spec-template-lightweight
      file: templates/spec-template-lightweight.md
      strategy: replace
    - type: template
      name: plan-template
      file: templates/plan-template.md
      strategy: replace
    - type: template
      name: tasks-template
      file: templates/tasks-template.md
      strategy: replace
    - type: command
      name: speckit.classify
      file: commands/classify.md
    - type: command
      name: speckit.example-map
      file: commands/example-map.md
    - type: command
      name: speckit.formulate
      file: commands/formulate.md
    - type: command
      name: speckit.contracts
      file: commands/contracts.md

tags: [typescript, specification, proportional-delivery]
