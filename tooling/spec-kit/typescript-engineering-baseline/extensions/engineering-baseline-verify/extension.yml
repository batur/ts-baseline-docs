schema_version: "1.0"

extension:
  id: engineering-baseline-verify
  name: Engineering Baseline Verify
  version: 0.1.0
  description: Deterministic specification, traceability, contract, generation, and completion validation.
  category: process
  effect: read-only
  author: typescript-engineering-baseline
  license: MIT

requires:
  speckit_version: "==1.0.5"
  tools:
    - name: pnpm
      version: "=11.9.0"
      required: true

provides:
  commands:
    - name: speckit.engineering.verify
      file: commands/verify.md
      description: Run deterministic verification through the fixed repository command.

hooks:
  before_implement:
    command: speckit.engineering.verify
    optional: false
    description: Block implementation unless gates, specification, traceability, and contracts are current.
  after_implement:
    command: speckit.engineering.verify
    optional: false
    description: Block completion unless all baseline checks converge.

tags: [verification, traceability, contracts]
