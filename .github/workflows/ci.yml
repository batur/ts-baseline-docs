name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engineering-baseline:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 1. Agent skills, Spec Kit components/bundle, and specification
      - name: Validate agent skills
        run: pnpm skills:check

      - name: Validate Spec Kit bundle and specification
        run: pnpm baseline:verify

      # 2. Traceability
      - name: Validate traceability
        run: pnpm traceability:check

      # 3. Contract lint, compatibility, manifests, and generated drift
      - name: Validate contracts and generated artifacts
        run: pnpm contracts:check

      - name: Prove deterministic generation
        run: pnpm baseline:clean-checkout

      # 4. Static checks
      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # 5. Inner RED -> GREEN -> REFACTOR suite
      - name: Unit and integration tests
        run: pnpm test

      # 6. Outer behavior suite
      - name: Cucumber dry run
        run: pnpm test:bdd:dry

      - name: Cucumber ready scenarios
        run: pnpm test:bdd:ready

      - name: Cucumber draft dogfood scenarios
        run: pnpm test:bdd

      - name: Upload Cucumber failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-failure-report
          path: reports/cucumber/cucumber.json
          if-no-files-found: ignore

      # 7. Provider contract/conformance tests
      - name: Provider contract tests
        run: pnpm contracts:test

      # 8. Browser E2E
      - name: End-to-end tests
        run: pnpm test:e2e

      # 9. Build and supply-chain gates
      - name: Build
        run: pnpm build

      - name: Secret scan
        run: pnpm secrets:scan

      - name: Dependency audit
        run: pnpm run audit
