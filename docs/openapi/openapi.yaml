openapi: 3.1.0
info:
  title: TypeScript Baseline API
  version: 1.0.0
paths:
  /api/v1/users:
    post:
      operationId: createUser
      summary: Create a user.
      tags:
        - Users
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Idempotency key for side-effect-producing create requests.
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSuccessEnvelope"
        "409":
          description: Conflict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserErrorEnvelope"
        "422":
          description: Semantic or domain validation failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserErrorEnvelope"
    get:
      operationId: listUsers
      summary: List users with cursor pagination.
      tags:
        - Users
      security:
        - bearerAuth: []
      parameters:
        - name: organizationId
          in: query
          required: true
          description: Tenant boundary for the user collection.
          schema:
            type: string
            minLength: 1
        - name: limit
          in: query
          required: false
          description: Maximum number of users to return.
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: cursor
          in: query
          required: false
          description: Opaque cursor from the previous page.
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListUsersRequest"
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserCollectionEnvelope"
        "400":
          description: Malformed or structurally invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserErrorEnvelope"
        "401":
          description: Missing or invalid authentication.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserErrorEnvelope"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CreateUserRequest:
      $schema: http://json-schema.org/draft-07/schema#
      type: object
      additionalProperties: false
      required:
        - displayName
        - email
        - organizationId
      properties:
        displayName:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
        organizationId:
          type: string
          minLength: 1
    ListUsersRequest:
      $schema: http://json-schema.org/draft-07/schema#
      type: object
      additionalProperties: false
      required:
        - limit
        - organizationId
      properties:
        cursor:
          type: string
          minLength: 1
        limit:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
        organizationId:
          type: string
          minLength: 1
    UserResponse:
      $schema: http://json-schema.org/draft-07/schema#
      type: object
      additionalProperties: false
      required:
        - createdAt
        - displayName
        - id
      properties:
        createdAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        displayName:
          type: string
        id:
          type: string
          pattern: ^usr_.*
    ApiMeta:
      type: object
      additionalProperties: false
      required:
        - requestId
      properties:
        requestId:
          type: string
          minLength: 1
    UserSuccessEnvelope:
      $schema: http://json-schema.org/draft-07/schema#
      type: object
      additionalProperties: false
      required:
        - data
        - meta
      properties:
        data:
          $ref: "#/components/schemas/UserResponse"
        meta:
          $ref: "#/components/schemas/ApiMeta"
    CursorPagination:
      type: object
      additionalProperties: false
      required:
        - hasNextPage
        - limit
        - nextCursor
      properties:
        hasNextPage:
          type: boolean
        limit:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        nextCursor:
          anyOf:
            - type: string
            - type: "null"
    UserCollectionEnvelope:
      $schema: http://json-schema.org/draft-07/schema#
      type: object
      additionalProperties: false
      required:
        - data
        - meta
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/UserResponse"
        meta:
          $ref: "#/components/schemas/ApiMeta"
        pagination:
          $ref: "#/components/schemas/CursorPagination"
    ApiErrorDetail:
      type: object
      additionalProperties: false
      required:
        - code
        - field
        - message
      properties:
        code:
          type: string
        field:
          type: string
        message:
          type: string
    ApiError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - requestId
      properties:
        code:
          type: string
        details:
          type: array
          items:
            $ref: "#/components/schemas/ApiErrorDetail"
        message:
          type: string
        requestId:
          type: string
    UserErrorEnvelope:
      $schema: http://json-schema.org/draft-07/schema#
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/ApiError"
